name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: npm test
      # Publish only the app; tests, scripts, docs and raw sample data stay out of the public site.
      - run: |
          mkdir -p _site/sample
          cp index.html parser.js model.js ui.js export.js _site/
          cp -r data _site/
          cp sample/dars-lines.js _site/sample/
      # Pages must be enabled once in Settings > Pages (Source: GitHub Actions); GITHUB_TOKEN cannot enable it.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
